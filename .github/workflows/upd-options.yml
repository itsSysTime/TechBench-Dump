name: Append new options to tb.html

on:
  workflow_run:
    workflows: ["Generate option-values.json"]
    types:
      - completed
  workflow_dispatch:

jobs:
  update-html:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          clean: false

      - name: Ensure local main is up-to-date
        run: |
          # Find the branch name (fallback to 'main' if not found)
          BRANCH=${GITHUB_REF#refs/heads/}
          if [ -z "$BRANCH" ] || [ "$BRANCH" = "refs/heads/" ]; then
            BRANCH=main
          fi
      
          git fetch --no-tags --prune origin +refs/heads/*:refs/remotes/origin/*
          # If the local branch exists, check it out; otherwise create it from origin
          if git rev-parse --verify "$BRANCH" >/dev/null 2>&1; then
            git checkout "$BRANCH"
          else
            git checkout -b "$BRANCH" "origin/$BRANCH"
          fi
          git pull --rebase origin "$BRANCH" || true


      - name: Extract existing IDs from tb.html
        run: |
          sed -n '/<!-- OPT-START -->/,/<!-- OPT-END -->/p' tb.html \
            | grep -oP '<option\s+value="\K[0-9]+' \
            > existing_ids.tmp

      - name: Extract new IDs from option-values.json
        run: |
          jq -r '.products | keys[]' option-values.json > new_ids.tmp

      - name: Compute missing IDs
        run: |
          grep -vxFf existing_ids.tmp new_ids.tmp > missing_ids.tmp || true

      - name: Generate missing <option> tags
        run: |
          # Read missing IDs into a JSON array
          missing_json=$(jq -R -s 'split("\n") | map(select(length>0))' missing_ids.tmp)
      
          # Generate <option> tags only for missing IDs
          jq -r --argjson missing "$missing_json" '
            .products
            | to_entries
            | map(select(.key as $id | ($missing | index($id))))
            | map("<option value=\"" + (.key) + "\">" + (.value // "Unknown") + "</option>")
            | .[]
          ' option-values.json > append_options.tmp

      - name: Insert sorted missing IDs at correct numeric positions
        run: |
          # Sort missing IDs
          sort -n missing_ids.tmp | uniq > unique_missing_ids.tmp

          # Sort existing IDs
          sort -n existing_ids.tmp > sorted_existing_ids.tmp

          # Load missing IDs into array
          mapfile -t missing < unique_missing_ids.tmp

          # Load existing IDs into array
          mapfile -t existing < sorted_existing_ids.tmp

          # Prepare working file
          cp tb.html tb.new.html

          # For each missing ID, find correct insertion point
          for id in "${missing[@]}"; do
            # Find previous existing ID
            prev=$(printf "%s\n" "${existing[@]}" | awk -v id="$id" '$1 < id {print}' | tail -n 1)

            # Build option line
            label=$(jq -r --arg id "$id" '.products[$id]' option-values.json)
            option="<option value=\"$id\">$label</option>"

            if [ -z "$prev" ]; then
              # No previous ID → insert right after OPT-START
              awk -v opt="$option" '
                /<!-- OPT-START -->/ {
                  print
                  print opt
                  next
                }
                { print }
              ' tb.new.html > tb.tmp && mv tb.tmp tb.new.html
            else
              # Insert after previous ID
              awk -v prev="$prev" -v opt="$option" '
                $0 ~ "<option value=\""prev"\">" {
                  print
                  print opt
                  next
                }
                { print }
              ' tb.new.html > tb.tmp && mv tb.tmp tb.new.html
            fi
          done

          mv tb.new.html tb.html


      - name: Commit updated tb.html
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add tb.html
          git commit -m "Append new options to tb.html" || echo "No changes"
          git push

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: update-html
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
