name: Append new options to tb.html

on:
  workflow_run:
    workflows: ["Generate option-values.json"]
    types:
      - completed
  workflow_dispatch:

jobs:
  update-html:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Ensure local main is up-to-date
        run: |
          # Find the branch name (fallback to 'main' if not found)
          BRANCH=${GITHUB_REF#refs/heads/}
          if [ -z "$BRANCH" ] || [ "$BRANCH" = "refs/heads/" ]; then
            BRANCH=main
          fi
      
          git fetch --no-tags --prune origin +refs/heads/*:refs/remotes/origin/*
          # If the local branch exists, check it out; otherwise create it from origin
          if git rev-parse --verify "$BRANCH" >/dev/null 2>&1; then
            git checkout "$BRANCH"
          else
            git checkout -b "$BRANCH" "origin/$BRANCH"
          fi
          git pull --rebase origin "$BRANCH" || true


      - name: Extract existing IDs from tb.html
        run: |
          sed -n '/<!-- OPT-START -->/,/<!-- OPT-END -->/p' tb.html \
            | grep -oP '<option\s+value="\K[0-9]+' \
            > existing_ids.tmp

      - name: Extract new IDs from option-values.json
        run: |
          jq -r '.products | keys[]' option-values.json > new_ids.tmp

      - name: Compute missing IDs
        run: |
          grep -vxFf existing_ids.tmp new_ids.tmp > missing_ids.tmp || true

      - name: Generate missing <option> tags
        run: |
          # Read missing IDs into a JSON array
          missing_json=$(jq -R -s 'split("\n") | map(select(length>0))' missing_ids.tmp)
      
          # Generate <option> tags only for missing IDs
          jq -r --argjson missing "$missing_json" '
            .products
            | to_entries
            | map(select(.key as $id | ($missing | index($id))))
            | map("<option value=\"" + (.key) + "\">" + (.value // "Unknown") + "</option>")
            | .[]
          ' option-values.json > append_options.tmp

      - name: Insert sorted missing IDs after previous ID
        run: |
          # Determine first missing ID
          first_missing=$(head -n 1 missing_ids.tmp)
          prev_id=$((first_missing - 1))

          # Sort missing IDs numerically and remove duplicates
          sort -n missing_ids.tmp | uniq > unique_missing_ids.tmp

          # Rebuild sorted <option> lines for missing IDs
          : > append_options.tmp
          while read id; do
            label=$(jq -r --arg id "$id" '.products[$id]' option-values.json)
            echo "<option value=\"$id\">$label</option>" >> append_options.tmp
          done < unique_missing_ids.tmp

          # Insert the sorted missing ID block AFTER the previous ID, or before the end marker if the previous ID isn't found
          insert_line=$(grep -n "<option value=\"$prev_id\">" tb.html | cut -d: -f1 || true)

          if [ -z "$insert_line" ]; then
            awk '
            /<!-- OPT-END -->/ {
              system("cat append_options.tmp")
              print
              next
            }
            { print }
            ' tb.html > tb.new.html
          else
            awk -v insert_line="$insert_line" '
            NR == insert_line {
              print
              system("cat append_options.tmp")
              next
            }
            { print }
            ' tb.html > tb.new.html
          fi

          mv tb.new.html tb.html

      - name: Commit updated tb.html
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add tb.html
          git commit -m "Append new options to tb.html" || echo "No changes"
          git push

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: update-html
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
